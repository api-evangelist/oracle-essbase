components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication using Essbase username and password.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 Bearer token authentication for cloud deployments on Oracle Cloud Infrastructure.
  parameters:
    applicationName:
      name: applicationName
      in: path
      required: true
      description: Essbase application name.
      schema:
        type: string
    databaseName:
      name: databaseName
      in: path
      required: true
      description: Essbase database (cube) name.
      schema:
        type: string
  schemas:
    AboutInfo:
      type: object
      description: Information about the Essbase instance.
      properties:
        version:
          type: string
          description: Essbase version number.
        build:
          type: string
          description: Build identifier.
        catalog:
          type: string
          description: Catalog information.
    Application:
      type: object
      description: An Essbase application containing one or more databases (cubes).
      properties:
        name:
          type: string
          description: Application name.
        owner:
          type: string
          description: Application owner user ID.
        creationTime:
          type: integer
          format: int64
          description: Creation timestamp in milliseconds since epoch.
        modifiedBy:
          type: string
          description: User who last modified the application.
        modifiedTime:
          type: integer
          format: int64
          description: Last modification timestamp in milliseconds since epoch.
        status:
          type: string
          description: Current application status.
          enum:
            - started
            - stopped
        description:
          type: string
          description: Application description.
        type:
          type: string
          description: Application storage type.
          enum:
            - ASO
            - BSO
            - CURRENCY
        startTime:
          type: integer
          format: int64
          description: Application start timestamp in milliseconds since epoch.
        connectedUsersCount:
          type: integer
          format: int32
          description: Number of users currently connected.
        role:
          type: string
          description: Authenticated user role for this application.
        easManagedApp:
          type: boolean
          description: Whether the application is managed in EAS Lite.
        startStopAppAllowed:
          type: boolean
          description: Whether users with read permission can start the application.
        inspectAppAllowed:
          type: boolean
          description: Whether application inspection is allowed.
        encrypted:
          type: boolean
          description: Whether the application data is encrypted.
        aiConnection:
          type: string
          description: AI connection configuration name.
        appVariablesSetting:
          $ref: '#/components/schemas/VariablesSetting'
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
    ApplicationList:
      type: object
      description: Paginated list of Essbase applications.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Application'
        totalResults:
          type: integer
          format: int64
          description: Total number of matching results.
        limit:
          type: integer
          format: int64
          description: Maximum number of results per page.
        offset:
          type: integer
          format: int64
          description: Number of results skipped.
        hasMore:
          type: boolean
          description: Whether more results are available.
        count:
          type: integer
          format: int64
          description: Number of results in this page.
        properties:
          type: object
          additionalProperties:
            type: string
    CreateApplication:
      type: object
      description: Request body for creating a new Essbase application and database.
      required:
        - applicationName
        - databaseName
      properties:
        applicationName:
          type: string
          description: Application name (max 30 characters, no spaces, case-insensitive).
          maxLength: 30
        databaseName:
          type: string
          description: Database (cube) name (no spaces).
        allowDuplicates:
          type: boolean
          description: Allow duplicate member names in outline.
        enableScenario:
          type: boolean
          description: Enable scenario management (BSO only; must be false for ASO).
        databaseType:
          type: string
          description: Database storage type.
          enum:
            - BSO
            - ASO
        appType:
          type: string
          description: Application encoding type.
          enum:
            - NATIVE
            - UTF8
        dbType:
          type: string
          description: Database type classification.
          enum:
            - NORMAL
            - CURRENCY
            - ASO
        memberCount:
          type: integer
          format: int32
          description: Initial member count.
        memberPrefix:
          type: string
          description: Prefix for generated members.
    Database:
      type: object
      description: An Essbase database (cube) within an application.
      properties:
        name:
          type: string
          description: Database name.
        application:
          type: string
          description: Parent application name.
        owner:
          type: string
          description: Database owner user ID.
        creationTime:
          type: integer
          format: int64
          description: Creation timestamp in milliseconds since epoch.
        modifiedBy:
          type: string
          description: User who last modified the database.
        modifiedTime:
          type: integer
          format: int64
          description: Last modification timestamp in milliseconds since epoch.
        status:
          type: string
          description: Current database status.
          enum:
            - started
            - stopped
        startTime:
          type: integer
          format: int64
          description: Database start timestamp in milliseconds since epoch.
        description:
          type: string
          description: Database description.
        type:
          type: string
          description: Database storage type.
          enum:
            - ASO
            - BSO
            - CURRENCY
        applicationRole:
          type: string
          description: User application role for this database.
        easManagedApp:
          type: boolean
          description: Whether the parent application is managed in EAS Lite.
        startStopDBAllowed:
          type: boolean
          description: Permission to start or stop the database.
        inspectDBAllowed:
          type: boolean
          description: Permission to inspect the database.
        dbVariablesSetting:
          $ref: '#/components/schemas/VariablesSetting'
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
    DatabaseList:
      type: object
      description: Paginated list of databases.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Database'
        totalResults:
          type: integer
          format: int64
        limit:
          type: integer
          format: int64
        offset:
          type: integer
          format: int64
        hasMore:
          type: boolean
        count:
          type: integer
          format: int64
    JobInput:
      type: object
      description: Input for executing an asynchronous job.
      required:
        - jobtype
      properties:
        application:
          type: string
          description: Application name.
        db:
          type: string
          description: Database name.
        jobtype:
          type: string
          description: Type of job to execute.
          enum:
            - dataload
            - dimbuild
            - calc
            - clear
            - importExcel
            - exportExcel
            - lcmExport
            - lcmImport
            - clearAggregation
            - buildAggregation
            - asoBufferDataLoad
            - asoBufferCommit
            - exportData
            - mdxScript
        parameters:
          $ref: '#/components/schemas/JobParameters'
    JobParameters:
      type: object
      description: >-
        Job-specific parameters. Required fields depend on the job type. For
        dataload: file and optionally rule, abortOnError. For dimbuild: file
        and rule. For calc: script. For clear: option. For lcmExport/lcmImport:
        zipFileName.
      properties:
        file:
          type: string
          description: Source file name for dataload, dimbuild, or mdxScript jobs.
        rule:
          type: string
          description: Rules file name for dataload or dimbuild jobs.
        abortOnError:
          type: string
          description: Stop on first error (true/false) for dataload jobs.
        script:
          type: string
          description: Calculation script name (.csc file) for calc jobs.
        option:
          type: string
          description: Clear option for clear jobs.
          enum:
            - allData
            - upperLevel
            - nonInput
            - partialData
            - PARTIAL_DATA
        partialDataExpression:
          type: string
          description: MDX expression for partial data clear.
        importExcelFileName:
          type: string
          description: Excel workbook file name for importExcel jobs.
        catalogExcelPath:
          type: string
          description: Path to the workbook in the file catalog.
        loaddata:
          type: string
          description: Whether to load data (true/false) for importExcel jobs.
        recreateApplication:
          type: string
          description: Whether to recreate application if it exists (true/false).
        createFiles:
          type: string
          description: Whether to create cube artifacts (true/false).
        executeScript:
          type: string
          description: Whether to execute calc scripts (true/false).
        buildOption:
          type: string
          description: Build option for importExcel jobs.
          enum:
            - NONE
            - RETAIN_ALL_DATA
            - REMOVE_ALL_DATA
        dataLevel:
          type: string
          description: Data level for export operations.
          enum:
            - ALL_DATA
            - UPPER_LEVEL_BLOCKS
            - NON_INPUT_BLOCKS
            - LEVEL_ZERO_BLOCKS
            - INPUT_LEVEL_DATA_BLOCKS
        columnFormat:
          type: string
          description: Whether to use tabular format (true/false).
        compress:
          type: string
          description: Whether to compress data (true/false).
        zipFileName:
          type: string
          description: Backup zip file name for lcmExport/lcmImport jobs.
        skipdata:
          type: string
          description: Whether to exclude data from LCM export (true/false).
        generateArtifactList:
          type: string
          description: Whether to generate artifact list (true/false).
        overwrite:
          type: string
          description: Whether to overwrite existing resources (true/false).
        targetApplicationName:
          type: string
          description: Target application name for lcmImport if different from source.
        includeServerLevel:
          type: string
          description: Include global connections and datasources (true/false).
        basedOnQueryData:
          type: string
          description: Select based on query patterns (true/false) for buildAggregation.
        ratioToStop:
          type: string
          description: Size ratio stopping value for buildAggregation.
        enableAlternateRollups:
          type: string
          description: Consider secondary hierarchies (true/false).
        bufferId:
          type: integer
          description: Single buffer ID for asoBufferCommit (1-4294967296).
        commitOption:
          type: string
          description: Commit option for asoBufferCommit.
          enum:
            - STORE_DATA
            - ADD_DATA
            - SUBTRACT_DATA
            - OVERRIDE_ALL_DATA
            - OVERRIDE_INCREMENTAL_DATA
        actionType:
          type: string
          description: Action type for asoBufferCommit.
          enum:
            - COMMIT
            - ABORT
        restructureOption:
          type: string
          description: Data preservation option for dimbuild.
          enum:
            - PRESERVE_ALL_DATA
            - PRESERVE_NO_DATA
            - PRESERVE_LEAFLEVEL_DATA
            - PRESERVE_INPUT_DATA
        forceDimBuild:
          type: string
          description: Force build despite user activity (true/false).
        rtsv:
          type: array
          description: Runtime substitution variables for calc jobs.
          items:
            $ref: '#/components/schemas/RuntimeSubstitutionVariable'
        useConnection:
          type: string
          description: Whether to use a saved connection (true/false).
        connection:
          type: string
          description: Connection name for dataload or dimbuild.
    JobRecord:
      type: object
      description: Record of an executed or running job.
      properties:
        job_ID:
          type: integer
          format: int64
          description: Unique job identifier.
        appName:
          type: string
          description: Application name.
        dbName:
          type: string
          description: Database name.
        jobType:
          type: string
          description: Job type that was executed.
        jobfileName:
          type: string
          description: Associated script or file name.
        userName:
          type: string
          description: User who submitted the job.
        startTime:
          type: integer
          format: int64
          description: Job start time in milliseconds since epoch.
        endTime:
          type: integer
          format: int64
          description: Job end time in milliseconds since epoch.
        statusCode:
          type: integer
          format: int32
          description: 'Status code: 100=In Progress, 200=Completed, 300=Completed with Warnings, 400=Failed.'
        statusMessage:
          type: string
          description: Human-readable status message.
        jobInputInfo:
          type: object
          description: Input parameters used for the job.
          additionalProperties: true
        jobOutputInfo:
          type: object
          description: Output and results of the job.
          additionalProperties: true
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
    JobList:
      type: object
      description: Paginated list of job records.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/JobRecord'
        totalResults:
          type: integer
          format: int64
        limit:
          type: integer
          format: int64
        offset:
          type: integer
          format: int64
        hasMore:
          type: boolean
        count:
          type: integer
          format: int64
    RuntimeSubstitutionVariable:
      type: object
      description: A runtime substitution variable for calculation scripts.
      properties:
        name:
          type: string
          description: Variable name.
        type:
          type: string
          description: Variable data type.
          enum:
            - STRING
            - NUMBER
            - DATE
            - MEMBER
        value:
          description: Default value.
        dimension:
          type: string
          description: Dimension name (for MEMBER type).
        singleChoice:
          type: boolean
          description: Whether only a single member can be selected.
        allowMissing:
          type: boolean
          description: Whether missing data is allowed.
    Session:
      type: object
      description: An active user session on the Essbase server.
      properties:
        userId:
          type: string
          description: Logged-in user name.
        sessionId:
          type: string
          description: Numeric session identifier.
        loginTimeInSeconds:
          type: string
          description: Number of seconds ago the session began.
        application:
          type: string
          description: Name of active application.
        database:
          type: string
          description: Name of active database.
        dbConnectTimeInSeconds:
          type: string
          description: Number of seconds ago the database was set active.
        request:
          type: string
          description: Type of active request (e.g., calculation, data load, restructure).
        requestTimeInSeconds:
          type: string
          description: Number of seconds the active request has been running.
        connectionSource:
          type: string
          description: Host name of the connected service.
        requestState:
          type: string
          description: Status of the active request.
    User:
      type: object
      description: An Essbase user account.
      properties:
        id:
          type: string
          description: User identifier.
        name:
          type: string
          description: User display name (max 256 characters).
          maxLength: 256
        email:
          type: string
          format: email
          description: User email address.
        password:
          type: string
          format: password
          description: User password (write-only, not returned in responses).
        role:
          type: string
          description: User service role.
          enum:
            - User
            - Power User
            - Service Administrator
        token:
          type: string
          description: User authentication token.
        groups:
          type: array
          description: List of group names the user belongs to.
          items:
            type: string
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
    UserInput:
      type: object
      description: Input for creating or updating a user.
      required:
        - id
      properties:
        id:
          type: string
          description: User identifier.
        name:
          type: string
          description: User display name.
          maxLength: 256
        email:
          type: string
          format: email
          description: User email address.
        password:
          type: string
          format: password
          description: User password.
        role:
          type: string
          description: User service role.
          enum:
            - User
            - Power User
            - Service Administrator
        groups:
          type: array
          description: Group names to assign the user to.
          items:
            type: string
    UserList:
      type: object
      description: Paginated list of users.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        totalResults:
          type: integer
          format: int64
        count:
          type: integer
          format: int64
        limit:
          type: integer
          format: int64
        offset:
          type: integer
          format: int64
        hasMore:
          type: boolean
    Group:
      type: object
      description: An Essbase user group.
      properties:
        id:
          type: string
          description: Group identifier.
        name:
          type: string
          description: Group name.
        description:
          type: string
          description: Group description.
        role:
          type: string
          description: Service role assigned to the group.
        members:
          type: array
          description: List of member user IDs or sub-group names.
          items:
            type: string
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
    GroupInput:
      type: object
      description: Input for creating or updating a group.
      required:
        - name
      properties:
        name:
          type: string
          description: Group name.
        description:
          type: string
          description: Group description.
        role:
          type: string
          description: Service role to assign to the group.
        members:
          type: array
          description: Member user IDs or sub-group names.
          items:
            type: string
    GroupList:
      type: object
      description: Paginated list of groups.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Group'
        totalResults:
          type: integer
          format: int64
        count:
          type: integer
          format: int64
        limit:
          type: integer
          format: int64
        offset:
          type: integer
          format: int64
        hasMore:
          type: boolean
    Script:
      type: object
      description: A calculation or MDX script associated with a database.
      properties:
        name:
          type: string
          description: Script name.
        content:
          type: string
          description: Script content (calculation or MDX statements).
        modifiedBy:
          type: string
          description: User who last modified the script.
        modifiedTime:
          type: integer
          format: int64
          description: Last modification timestamp in milliseconds since epoch.
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
    ScriptInput:
      type: object
      description: Input for creating or updating a script.
      required:
        - name
        - content
      properties:
        name:
          type: string
          description: Script name.
        content:
          type: string
          description: Script content (calculation or MDX statements).
    ScriptList:
      type: object
      description: List of scripts.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Script'
    Filter:
      type: object
      description: A security filter that controls member-level access to a database.
      properties:
        name:
          type: string
          description: Filter name.
        description:
          type: string
          description: Filter description.
        rows:
          type: array
          description: Filter row definitions specifying access levels per member combination.
          items:
            $ref: '#/components/schemas/FilterRow'
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
    FilterInput:
      type: object
      description: Input for creating or updating a security filter.
      required:
        - name
      properties:
        name:
          type: string
          description: Filter name.
        description:
          type: string
          description: Filter description.
        rows:
          type: array
          items:
            $ref: '#/components/schemas/FilterRow'
    FilterRow:
      type: object
      description: A single row in a security filter defining access for a member combination.
      properties:
        access:
          type: string
          description: Access level.
          enum:
            - READ
            - WRITE
            - NONE
            - METAREAD
        member:
          type: string
          description: Member specification or combination.
    FilterList:
      type: object
      description: List of filters.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Filter'
    FileItem:
      type: object
      description: A file or folder entry in the Essbase file catalog.
      properties:
        name:
          type: string
          description: File or folder name.
        fullPath:
          type: string
          description: Full path in the file catalog.
        type:
          type: string
          description: Item type.
          enum:
            - file
            - folder
        permissions:
          type: object
          description: Permissions on this item.
          properties:
            addFolder:
              type: boolean
              description: Permission to add sub-folders.
            addFile:
              type: boolean
              description: Permission to add files.
    FileList:
      type: object
      description: File catalog listing response.
      properties:
        currentFolder:
          $ref: '#/components/schemas/FileItem'
        items:
          type: array
          items:
            $ref: '#/components/schemas/FileItem'
        totalResults:
          type: integer
          format: int64
        count:
          type: integer
          format: int64
        limit:
          type: integer
          format: int64
        offset:
          type: integer
          format: int64
        hasMore:
          type: boolean
    Connection:
      type: object
      description: A data source connection for data loading and dimension building.
      properties:
        name:
          type: string
          description: Connection name.
        description:
          type: string
          description: Connection description.
        type:
          type: string
          description: Connection type (e.g., Oracle, SQL Server, file-based).
        host:
          type: string
          description: Database host or server address.
        port:
          type: integer
          format: int32
          description: Database port number.
        serviceName:
          type: string
          description: Database service or SID name.
        user:
          type: string
          description: Database username.
        walletPath:
          type: string
          description: Path to the wallet file for secure connections.
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
    ConnectionInput:
      type: object
      description: Input for creating or updating a connection.
      required:
        - name
        - type
      properties:
        name:
          type: string
          description: Connection name.
        description:
          type: string
          description: Connection description.
        type:
          type: string
          description: Connection type.
        host:
          type: string
          description: Database host or server address.
        port:
          type: integer
          format: int32
          description: Database port number.
        serviceName:
          type: string
          description: Database service or SID name.
        user:
          type: string
          description: Database username.
        password:
          type: string
          format: password
          description: Database password.
    Dimension:
      type: object
      description: A dimension in an Essbase database outline.
      properties:
        name:
          type: string
          description: Dimension name.
        type:
          type: string
          description: Dimension type (e.g., accounts, time, attribute).
        storageType:
          type: string
          description: Dimension storage type.
        tag:
          type: string
          description: Dimension tag.
        memberCount:
          type: integer
          format: int32
          description: Number of members in the dimension.
    Lock:
      type: object
      description: A lock on a database object or block.
      properties:
        lockId:
          type: string
          description: Lock identifier.
        userId:
          type: string
          description: User who holds the lock.
        objectName:
          type: string
          description: Name of the locked object.
        lockType:
          type: string
          description: Type of lock.
        lockTime:
          type: integer
          format: int64
          description: Time the lock was acquired in milliseconds since epoch.
    Variable:
      type: object
      description: A substitution variable used in calculations and scripts.
      properties:
        name:
          type: string
          description: Variable name.
        value:
          type: string
          description: Variable value.
    VariablesSetting:
      type: object
      description: Settings controlling variable visibility and update permissions.
      properties:
        showVariables:
          type: boolean
          description: Whether substitution variables are visible.
        updateVariables:
          type: boolean
          description: Whether substitution variables can be updated.
    Link:
      type: object
      description: HATEOAS navigation link.
      properties:
        rel:
          type: string
          description: Link relation type.
        href:
          type: string
          format: uri
          description: Link URL.
        method:
          type: string
          description: HTTP method for this link.
        type:
          type: string
          description: Media type of the linked resource.
    Error:
      type: object
      description: Error response from the Essbase REST API.
      properties:
        message:
          type: string
          description: Human-readable error message.
        errorCode:
          type: string
          description: Machine-readable error code.
        details:
          type: string
          description: Additional error details.
