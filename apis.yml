  - type: Documentation
    url: https://docs.oracle.com/en/database/other-databases/essbase/21/esjav/
- name: Essbase C API
  description: C API for building high-performance applications that interact with Essbase databases. Includes the
    Grid API for Smart View-like functionality and the Outline API for programmatic outline manipulation.
  humanURL: https://docs.oracle.com/en/database/other-databases/essbase/21/esoac/
  tags:
  - C API
  - Grid API
  - Native Interface
  - Outline API
  - SDK
  properties:
  - type: Documentation
    url: https://docs.oracle.com/en/database/other-databases/essbase/21/esoac/
- name: Essbase MaxL Scripting Interface
  description: MaxL is the multi-dimensional database access language for Essbase that provides a scripting-based
    interface for administering and querying Essbase. It enables automation of administrative operations using statements
    rather than a series of commands.
  humanURL: https://docs.oracle.com/en/database/other-databases/essbase/21/esssr/maxl.html
