naftiko: 1.0.0-alpha2
info:
  label: Oracle Essbase REST API — Sessions
  description: 'Oracle Essbase REST API — Sessions. 2 operations. Lead operation: Oracle Essbase List Sessions. Self-contained
    Naftiko capability covering one Oracle Essbase business surface.'
  tags:
  - Oracle Essbase
  - Sessions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ORACLE_ESSBASE_API_KEY: ORACLE_ESSBASE_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-sessions
    baseUri: https://{host}:{port}/essbase/rest/v1
    description: Oracle Essbase REST API — Sessions business capability. Self-contained, no shared references.
    resources:
    - name: sessions
      path: /sessions
      operations:
      - name: listsessions
        method: GET
        description: Oracle Essbase List Sessions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: application
          in: query
          type: string
          description: Filter by application name.
        - name: database
          in: query
          type: string
          description: Filter by database name.
        - name: userId
          in: query
          type: string
          description: Filter by user ID. If not provided, returns all sessions.
    - name: sessions-sessionId
      path: /sessions/{sessionId}
      operations:
      - name: deletesession
        method: DELETE
        description: Oracle Essbase Delete Session
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: sessionId
          in: path
          type: string
          description: Session identifier to terminate.
          required: true
    authentication:
      type: bearer
      token: '{{env.ORACLE_ESSBASE_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-sessions-rest
    port: 8080
    description: REST adapter for Oracle Essbase REST API — Sessions. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/sessions
      name: sessions
      description: REST surface for sessions.
      operations:
      - method: GET
        name: listsessions
        description: Oracle Essbase List Sessions
        call: rest-sessions.listsessions
        with:
          application: rest.application
          database: rest.database
          userId: rest.userId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/sessions/{sessionid}
      name: sessions-sessionid
      description: REST surface for sessions-sessionId.
      operations:
      - method: DELETE
        name: deletesession
        description: Oracle Essbase Delete Session
        call: rest-sessions.deletesession
        with:
          sessionId: rest.sessionId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-sessions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Oracle Essbase REST API — Sessions. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: oracle-essbase-list-sessions
      description: Oracle Essbase List Sessions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-sessions.listsessions
      with:
        application: tools.application
        database: tools.database
        userId: tools.userId
      outputParameters:
      - type: object
        mapping: $.
    - name: oracle-essbase-delete-session
      description: Oracle Essbase Delete Session
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: rest-sessions.deletesession
      with:
        sessionId: tools.sessionId
      outputParameters:
      - type: object
        mapping: $.
