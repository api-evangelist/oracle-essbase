naftiko: 1.0.0-alpha2
info:
  label: Oracle Essbase REST API — Reports
  description: 'Oracle Essbase REST API — Reports. 1 operations. Lead operation: Oracle Essbase Execute Report Script. Self-contained
    Naftiko capability covering one Oracle Essbase business surface.'
  tags:
  - Oracle Essbase
  - Reports
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ORACLE_ESSBASE_API_KEY: ORACLE_ESSBASE_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-reports
    baseUri: https://{host}:{port}/essbase/rest/v1
    description: Oracle Essbase REST API — Reports business capability. Self-contained, no shared references.
    resources:
    - name: applications-applicationName-databases-databaseName-executeReport
      path: /applications/{applicationName}/databases/{databaseName}/executeReport
      operations:
      - name: executereportscript
        method: GET
        description: Oracle Essbase Execute Report Script
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.ORACLE_ESSBASE_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-reports-rest
    port: 8080
    description: REST adapter for Oracle Essbase REST API — Reports. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/applications/{applicationname}/databases/{databasename}/executereport
      name: applications-applicationname-databases-databasename-executereport
      description: REST surface for applications-applicationName-databases-databaseName-executeReport.
      operations:
      - method: GET
        name: executereportscript
        description: Oracle Essbase Execute Report Script
        call: rest-reports.executereportscript
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-reports-mcp
    port: 9090
    transport: http
    description: MCP adapter for Oracle Essbase REST API — Reports. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: oracle-essbase-execute-report-script
      description: Oracle Essbase Execute Report Script
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-reports.executereportscript
      outputParameters:
      - type: object
        mapping: $.
