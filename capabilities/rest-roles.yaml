naftiko: 1.0.0-alpha2
info:
  label: Oracle Essbase REST API — Roles
  description: 'Oracle Essbase REST API — Roles. 1 operations. Lead operation: Oracle Essbase Get Application Provisioning
    Report. Self-contained Naftiko capability covering one Oracle Essbase business surface.'
  tags:
  - Oracle Essbase
  - Roles
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ORACLE_ESSBASE_API_KEY: ORACLE_ESSBASE_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-roles
    baseUri: https://{host}:{port}/essbase/rest/v1
    description: Oracle Essbase REST API — Roles business capability. Self-contained, no shared references.
    resources:
    - name: applications-applicationName-provisionReport
      path: /applications/{applicationName}/provisionReport
      operations:
      - name: getapplicationprovisioningreport
        method: GET
        description: Oracle Essbase Get Application Provisioning Report
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.ORACLE_ESSBASE_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-roles-rest
    port: 8080
    description: REST adapter for Oracle Essbase REST API — Roles. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/applications/{applicationname}/provisionreport
      name: applications-applicationname-provisionreport
      description: REST surface for applications-applicationName-provisionReport.
      operations:
      - method: GET
        name: getapplicationprovisioningreport
        description: Oracle Essbase Get Application Provisioning Report
        call: rest-roles.getapplicationprovisioningreport
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-roles-mcp
    port: 9090
    transport: http
    description: MCP adapter for Oracle Essbase REST API — Roles. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: oracle-essbase-get-application-provisioning
      description: Oracle Essbase Get Application Provisioning Report
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-roles.getapplicationprovisioningreport
      outputParameters:
      - type: object
        mapping: $.
