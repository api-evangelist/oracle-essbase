    namespace: rest-application-configuration-mcp
    port: 9090
    transport: http
    description: MCP adapter for Oracle Essbase REST API — Application Configuration. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: oracle-essbase-list-application-configurations
      description: Oracle Essbase List Application Configurations
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-application-configuration.listapplicationconfigurations
      outputParameters:
      - type: object
        mapping: $.
    - name: oracle-essbase-update-application-configurations
      description: Oracle Essbase Update Application Configurations
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: rest-application-configuration.updateapplicationconfigurations
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
