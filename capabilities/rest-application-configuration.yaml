  - type: http
    namespace: rest-application-configuration
    baseUri: https://{host}:{port}/essbase/rest/v1
    description: Oracle Essbase REST API — Application Configuration business capability. Self-contained, no shared references.
    resources:
    - name: applications-applicationName-configurations
      path: /applications/{applicationName}/configurations
      operations:
      - name: listapplicationconfigurations
        method: GET
        description: Oracle Essbase List Application Configurations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateapplicationconfigurations
        method: PUT
        description: Oracle Essbase Update Application Configurations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.ORACLE_ESSBASE_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-application-configuration-rest
    port: 8080
    description: REST adapter for Oracle Essbase REST API — Application Configuration. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/applications/{applicationname}/configurations
      name: applications-applicationname-configurations
      description: REST surface for applications-applicationName-configurations.
      operations:
      - method: GET
        name: listapplicationconfigurations
        description: Oracle Essbase List Application Configurations
        call: rest-application-configuration.listapplicationconfigurations
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updateapplicationconfigurations
        description: Oracle Essbase Update Application Configurations
        call: rest-application-configuration.updateapplicationconfigurations
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
