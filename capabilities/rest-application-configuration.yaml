  description: 'Oracle Essbase REST API — Application Configuration. 2 operations. Lead operation: Oracle Essbase List Application
    Configurations. Self-contained Naftiko capability covering one Oracle Essbase business surface.'
  tags:
  - Oracle Essbase
  - Application Configuration
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ORACLE_ESSBASE_API_KEY: ORACLE_ESSBASE_API_KEY
capability:
