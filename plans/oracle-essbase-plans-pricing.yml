specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Oracle Essbase
providerId: oracle-essbase
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: false
tags:
  - Analytics
  - Business Intelligence
  - Multi-Dimensional Database
  - OLAP
  - Oracle Cloud
description: >-
  Oracle Essbase is delivered through the Oracle Cloud Marketplace as a
  Bring-Your-Own-License (BYOL) image deployed on Oracle Cloud Infrastructure
  (OCI) compute. There is no separate per-API or per-user public price for
  Essbase itself. Customers pay for the underlying OCI compute, block storage,
  and networking consumed by the Essbase instance, and supply an existing
  Oracle Analytics or Essbase license. On-premises deployments are licensed
  per processor or named-user-plus through the Oracle Technology global price
  list. Pricing is not published in machine-readable form; engage Oracle Sales
  for the applicable rate sheet.
sources:
  - https://www.oracle.com/business-analytics/essbase/
  - https://cloudmarketplace.oracle.com/marketplace/en_US/listing/79529283
  - https://docs.oracle.com/en/database/other-databases/essbase/
notes: >-
  Oracle blocks programmatic fetches of www.oracle.com pricing pages (HTTP 403).
  Plan structure preserved as a single BYOL/Marketplace tier plus an Enterprise
  custom-licensing tier; replace with verified Oracle Technology Global Price
  List values when available.
plans:
  - id: oracle-essbase-byol-marketplace
    name: BYOL on OCI Marketplace
    type: usage-based
    description: >-
      Bring-Your-Own-License Essbase image on Oracle Cloud Infrastructure.
      Charges accrue against the underlying OCI compute, storage, and
      networking; the Essbase software itself requires a separately purchased
      Oracle license.
    entries:
      - label: OCI Compute (Essbase host)
        name: oci_compute
        type: metered
        metric: ocpu-hour
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: see https://www.oracle.com/cloud/price-list/
        userMultiplied: false
      - label: OCI Block Storage
        name: oci_block_storage
        type: metered
        metric: gb-month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: see https://www.oracle.com/cloud/price-list/
        userMultiplied: false
      - label: Essbase License (BYOL)
        name: essbase_license
        type: subscription
        metric: license
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Oracle Essbase REST API
      - name: Essbase Java API
      - name: Essbase C API
      - name: Essbase MaxL Scripting Interface
      - name: Essbase CLI (Command Line Interface)
  - id: oracle-essbase-enterprise
    name: Enterprise (On-Premises or OCI)
    type: enterprise
    description: >-
      Negotiated Oracle Technology license for on-premises Essbase or
      OCI-hosted deployments. Priced per processor or per named-user-plus on
      the Oracle Technology Global Price List, with separately negotiated
      support, premier maintenance, and optional Oracle Analytics Cloud
      bundling.
    entries:
      - label: Per-Processor License
        name: per_processor_license
        type: subscription
        metric: processor
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
      - label: Named User Plus License
        name: named_user_plus
        type: subscription
        metric: user
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: true
    elements:
      - name: Oracle Essbase REST API
      - name: Essbase Java API
      - name: Essbase C API
      - name: Essbase MaxL Scripting Interface
      - name: Essbase CLI (Command Line Interface)
maintainers:
