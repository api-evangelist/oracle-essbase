specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: Oracle Essbase
providerId: oracle-essbase
publisherName: Oracle America, Inc.
serviceCategory: Analytics
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Analytics
  - OLAP
  - Oracle Cloud
  - FinOps
  - FOCUS
description: >-
  FOCUS-aligned FinOps view for Oracle Essbase: cost is composed of underlying
  OCI compute, block storage, and networking consumed by the Essbase host, plus
  a separately negotiated Oracle Technology license (BYOL or per-processor /
  named-user-plus on-premises).
sources:
  - https://www.oracle.com/business-analytics/essbase/
  - https://cloudmarketplace.oracle.com/marketplace/en_US/listing/79529283
  - https://www.oracle.com/cloud/price-list/
notes: >-
  No public per-API meter exists. FinOps observation is performed against OCI
  Cost Analysis (Cost-Tracking Tags) for the Essbase host plus the contractual
  Oracle Technology license line.
billingModel:
  pricingCategory: BYOL + Pay-As-You-Go (OCI Compute)
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Adjustment
    - Credit
focusColumns:
  ServiceName: Oracle Essbase
  ServiceCategory: Analytics
  ProviderName: Oracle
  PublisherName: Oracle America, Inc.
  InvoiceIssuerName: Oracle America, Inc.
  BillingCurrency: USD
  PricingCategory: BYOL + Usage
  ChargeCategory: Usage
meters:
  - name: oci_compute_ocpu_hours
    description: OCPU-hours consumed by the OCI compute instance hosting Essbase
    unit: ocpu-hour
    aggregation: sum
    dimensions:
      - region
      - shape
      - tag
  - name: oci_block_storage_gb_month
    description: Block storage attached to the Essbase host
    unit: GB-month
    aggregation: sum
    dimensions:
      - region
      - tag
  - name: oci_egress_gb
    description: Outbound data transfer from the Essbase host
    unit: GB
    aggregation: sum
    dimensions:
      - region
  - name: essbase_license
    description: Contractual Oracle Technology license for Essbase (per-processor or NUP)
    unit: license
    aggregation: max
    dimensions:
      - license_type
principles:
  - name: Visibility
    description: >-
      Use OCI Cost Analysis with cost-tracking tags applied to the Essbase
      compute, block volumes, and VCN to view consumption; reconcile against
      the Oracle Technology license entitlement separately.
  - name: Allocation
    description: >-
      Apply OCI cost-tracking tags (e.g. team, application, environment) to
      every Essbase host and storage volume so spend can be attributed to
      consuming products.
  - name: Optimization
    description: >-
      Right-size the OCI compute shape to match actual calc and query
      concurrency, schedule non-production instances to stop outside business
      hours, and consolidate small Essbase applications onto shared hosts
      where license terms permit.
  - name: Accountability
    description: >-
      Assign an owner to each Essbase application; review OCI consumption and
      Oracle support renewals quarterly.
apis:
  - name: Oracle Essbase REST API
    serviceName: Oracle Essbase REST API
    serviceCategory: Analytics
  - name: Essbase Java API
    serviceName: Essbase Java API
    serviceCategory: Analytics
  - name: Essbase C API
    serviceName: Essbase C API
    serviceCategory: Analytics
  - name: Essbase MaxL Scripting Interface
    serviceName: Essbase MaxL Scripting Interface
    serviceCategory: Analytics
  - name: Essbase CLI (Command Line Interface)
    serviceName: Essbase CLI (Command Line Interface)
    serviceCategory: Analytics
maintainers:
